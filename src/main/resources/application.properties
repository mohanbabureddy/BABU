# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rent_app?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Charmy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Port
server.port=8080
server.address=0.0.0.0

# Razorpay API Keys
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

logging.file.name=logs/app.log

# Log pattern (optional)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg [%C.%M:%L]%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg [%C.%M:%L]%n

# Log level (optional)
logging.level.root=INFO

logging.console.enabled=false

# Email Service (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.transport.protocol=smtp

# Required by EmailWithInvoiceService
spring.mail.from=${MAIL_FROM:}

# Tenant Email Mappings
tenants.emails.Room1=${TENANT_EMAIL_ROOM1:}
tenants.emails.Room2=${TENANT_EMAIL_ROOM2:}
tenants.adminEmail=${TENANTS_ADMIN_EMAIL:}

server.tomcat.accesslog.enabled=true

# Removed Twilio config properties. Now loaded from DB.

spring.cache.type=simple

spring.web.resources.static-locations=classpath:/static/,file:./uploads/
